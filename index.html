<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Language" content="en-US">
	<meta name="language" content="English">
	<title>Time</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css" />
	<link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<div class="ambient-glow" aria-hidden="true"></div>

	<header class="topbar">
		<div class="controls-group controls-left">
			<select id="country-select" aria-label="Select country timezone"></select>
			<select id="language-select" aria-label="Select language">
				<option value="en-US">🇬🇧 English</option>
				<option value="pt-PT">🇵🇹 Português (Portugal)</option>
				<option value="pt-BR">🇧🇷 Português (Brasil)</option>
			</select>
		</div>
		<div class="controls-group controls-right">
			<button id="format-toggle" title="Toggle 12h/24h" aria-label="Toggle 12 hour or 24 hour format">24h</button>
			<button id="fullscreen-btn" aria-label="Toggle fullscreen">
				<i class="bi bi-fullscreen" id="fullscreen-icon"></i>
			</button>
		</div>
	</header>

	<main id="clock-container">
		<div id="clock">--:--:--</div>
		<div id="date">--</div>
	</main>

	<script src="timezones.js"></script>
	<script src="script.js"></script>
</body>

</html>
